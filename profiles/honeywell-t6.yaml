name: honeywell-t6
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
      - id: thermostatMode
        version: 1
      - id: thermostatOperatingState
        version: 1
      - id: silvervalley08660.connectionStatus
        version: 1
      - id: silvervalley08660.connectionLog
        version: 1
      - id: silvervalley08660.heatDemand
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: Thermostat
preferences:
  - name: offlineAfter
    title: Offline after (minutes)
    description: "Connection only turns Offline after this many minutes without contact, so a short network outage (e.g. a router update at night) gives no notification."
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 120
      default: 5
  - name: homekitCode
    title: HomeKit code
    description: "While pairing the thermostat shows an 8-digit code on its display (not the sticker): type it here within 5 minutes."
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: ipAddress
    title: Thermostat IP (optional)
    description: Leave on "auto" (found via mDNS). Only set when discovery fails.
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "auto"
  - name: hapPort
    title: HomeKit port (optional)
    description: 0 = auto (mDNS). Needed together with a fixed IP.
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
  - name: resetPairing
    title: Remove pairing
    description: Switch on to unpair the hub from the thermostat (e.g. before re-pairing).
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: idleSetpoint
    title: Setpoint without heat demand
    description: "In °C (a value above 40 is read as °F, e.g. 66). Used by the heat demand function (command setRoom from a rule): when no room asks for heat, the setpoint goes back to this value."
    required: false
    preferenceType: number
    definition:
      minimum: 5
      maximum: 86
      default: 19
  - name: stepPerRoom
    title: Extra degrees per room asking heat
    description: "In °C (0.5 °C is about 1 °F). With N rooms asking for heat the setpoint becomes the thermostat temperature (rounded up to 0.5 °C) plus N times this value."
    required: false
    preferenceType: number
    definition:
      minimum: 0
      maximum: 3
      default: 0.5
